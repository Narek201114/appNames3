<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Անունների Նշանակություն</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-gradient: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --border-color: #d1d5db;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 600px;
            margin: 20px;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05), 0 4px 6px rgba(0, 0, 0, 0.05);
            box-sizing: border-box;
            text-align: center;
        }

        h2 {
            margin-bottom: 24px;
            color: var(--primary-color);
            font-size: 28px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            font-size: 16px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            outline: none;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus {
            border-color: var(--primary-color);
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            background: #f9fafb;
            border-left: 5px solid var(--primary-color);
            border-radius: 8px;
            text-align: left;
            animation: fadeIn 0.5s ease-in-out;
        }

        .result h3 {
            margin-top: 0;
            color: var(--primary-color);
            font-size: 20px;
        }

        .result p {
            line-height: 1.6;
            white-space: pre-line;
            color: #4b5563;
        }

        .source-link {
            display: inline-block;
            margin-top: 15px;
            font-size: 14px;
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
        }

        .source-link:hover {
            text-decoration: underline;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            .search-box {
                flex-direction: column;
            }
            .container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>✨ Անունների Նշանակություն</h2>
        <form method="POST">
            <div class="search-box">
                <input type="text" name="name" placeholder="Մուտքագրեք անունը (օր․՝ Անի)..." value="{{ name if name else '' }}" required>
                <button type="submit">Որոնել</button>
            </div>
        </form>

        {% if meaning %}
            <div class="result">
                <h3>«{{ name }}» անվան իմաստը</h3>
                <p>{{ meaning }}</p>
                {% if source_url %}
                    <a class="source-link" href="{{ source_url }}" target="_blank">🔗 Աղբյուրը (այցելել կայք)</a>
                {% endif %}
            </div>
        {% endif %}
    </div>
</body>
</html>
