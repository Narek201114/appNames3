<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <title>Անունների Նշանակություն</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; color: #333; max-width: 600px; margin: 50px auto; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        input[type="text"] { width: 70%; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 20px; font-size: 16px; background-color: #007BFF; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        .result { margin-top: 20px; padding: 15px; background: #e9ecef; border-radius: 4px; white-space: pre-line; }
        a { color: #007BFF; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <h2>Իմանալ անվան նշանակությունը</h2>
    <form method="POST">
        <input type="text" name="name" placeholder="Մուտքագրեք անունը..." value="{{ name if name else '' }}" required>
        <button type="submit">Որոնել</button>
    </form>

    {% if meaning %}
        <div class="result">
            <h3>«{{ name }}» անվան նշանակությունը.</h3>
            <p>{{ meaning }}</p>
            <p><small>Աղբյուր՝ <a href="{{ source_url }}" target="_blank">Բացել կայքը</a></small></p>
        </div>
    {% elif name %}
        <div class="result">
            <p>Ցավոք, տեղեկություն չգտնվեց:</p>
        </div>
    {% endif %}
</body>
</html>
